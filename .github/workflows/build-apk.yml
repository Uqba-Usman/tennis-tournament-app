name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          cd projects/tennis-tournament-app
          npm install

      - name: Build Vue app
        run: |
          cd projects/tennis-tournament-app
          npm run build

      - name: Sync Capacitor
        run: |
          cd projects/tennis-tournament-app
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x projects/tennis-tournament-app/android/gradlew

      - name: Build Debug APK
        run: |
          cd projects/tennis-tournament-app/android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ace-tracker-debug
          path: projects/tennis-tournament-app/android/app/build/outputs/apk/debug/app-debug.apk
